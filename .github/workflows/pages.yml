name: Build, Crawl, and Deploy Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      full_crawl:
        description: "Fetch CCF-A/arXiv rawdata, enrich abstracts, then process"
        type: boolean
        default: false
      process_rawdata:
        description: "Process existing data/rawdata before building"
        type: boolean
        default: true
      from_year:
        description: "Full crawl start year"
        type: string
        default: "2020"
      to_year:
        description: "Full crawl end year; leave empty for the current UTC year"
        type: string
        default: ""
  schedule:
    # 01:00 Asia/Shanghai every day.
    - cron: "0 17 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve current year
        id: years
        run: echo "current_year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"

      - name: Select daily crawl year
        if: github.event_name == 'schedule'
        id: rotation
        run: python scripts/crawl_rotation.py select-year --from-year 2020 --to-year "${{ steps.years.outputs.current_year }}" --tracks AI,DB,SE

      - name: Fetch selected-year rawdata
        if: github.event_name == 'schedule'
        run: python scripts/fetch_rawdata.py --from-year "${{ steps.rotation.outputs.year }}" --to-year "${{ steps.rotation.outputs.year }}" --tracks AI,DB,SE --venues "${{ steps.rotation.outputs.venues }}" --no-arxiv --sleep 2.0 --incremental --active-year-refresh-days 7

      - name: Fetch full rawdata
        if: inputs.full_crawl
        run: python scripts/fetch_rawdata.py --from-year "${{ inputs.from_year || '2020' }}" --to-year "${{ inputs.to_year || steps.years.outputs.current_year }}" --tracks AI,DB,SE --arxiv-max-results 1000 --sleep 0.5

      - name: Fetch selected-year official accepted papers
        if: github.event_name == 'schedule'
        run: python scripts/fetch_official_accepted.py --from-year "${{ steps.rotation.outputs.year }}" --to-year "${{ steps.rotation.outputs.year }}" --venues "${{ steps.rotation.outputs.venues }}" --sleep 2.0 --incremental --active-year-refresh-days 7

      - name: Fetch official accepted papers
        if: inputs.full_crawl
        run: python scripts/fetch_official_accepted.py --from-year "${{ inputs.from_year || '2020' }}" --to-year "${{ inputs.to_year || steps.years.outputs.current_year }}" --sleep 0.5

      - name: Enrich selected-year abstracts
        if: github.event_name == 'schedule'
        run: >
          python scripts/enrich_abstracts.py data/rawdata/${{ steps.rotation.outputs.year }}
          --limit-per-file 80
          --global-limit 300
          --delay 1.0
          --skip-title-search
          --skip-pdf
          --venues "${{ steps.rotation.outputs.venues }}"
          --title-filter "(text[- ]?to[- ]?sql|text2sql|nl2sql|natural language|semantic parsing|sql|database|schema|query)"

      - name: Enrich full abstracts
        if: inputs.full_crawl
        run: >
          python scripts/enrich_abstracts.py data/rawdata
          --limit-per-file 80
          --delay 1.0
          --skip-title-search
          --title-filter "(text[- ]?to[- ]?sql|text2sql|nl2sql|natural language|semantic parsing|sql|database|schema|query)"

      - name: Process rawdata
        if: github.event_name == 'schedule' || inputs.process_rawdata || inputs.full_crawl
        run: python scripts/process_folder.py

      - name: Enrich selected label abstracts
        if: github.event_name == 'schedule' || inputs.process_rawdata || inputs.full_crawl
        run: python scripts/enrich_abstracts.py data/labeldata/labeldata.json --limit-per-file 200 --delay 2.0 --skip-doi-batch --skip-title-search

      - name: Reconcile CCF-A venues
        if: github.event_name == 'schedule' || inputs.process_rawdata || inputs.full_crawl
        run: python scripts/reconcile_ccf_venues.py

      - name: Dedupe and prune irrelevant papers
        if: github.event_name == 'schedule' || inputs.process_rawdata || inputs.full_crawl
        run: python scripts/merge_labeldata.py --dedupe-only --prune-irrelevant

      - name: Validate dataset
        if: github.event_name == 'schedule' || inputs.process_rawdata || inputs.full_crawl
        run: python scripts/validate_dataset.py --mode balanced --baseline HEAD:data/labeldata/labeldata.json --from-year "${{ inputs.from_year || '2020' }}" --to-year "${{ inputs.to_year || steps.years.outputs.current_year }}"

      - name: Audit literature sample
        if: github.event_name == 'schedule' || inputs.process_rawdata || inputs.full_crawl
        run: python scripts/audit_literature_sample.py

      - name: Update README snapshot
        if: github.event_name == 'schedule' || inputs.process_rawdata || inputs.full_crawl
        run: python scripts/update_readme_snapshot.py

      - name: Finalize daily crawl rotation
        if: github.event_name == 'schedule'
        run: python scripts/crawl_rotation.py finalize

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || inputs.process_rawdata || inputs.full_crawl
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/rawdata data/labeldata/labeldata.json data/venues.json data/reports web/index.html
          git diff --cached --quiet || git commit -m "Update crawled Text-to-SQL papers"
          git push

      - name: Publish web directory to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/text2sql-gh-pages
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/text2sql-gh-pages
          rsync -a --delete --exclude .git web/ /tmp/text2sql-gh-pages/
          touch /tmp/text2sql-gh-pages/.nojekyll
          cd /tmp/text2sql-gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy site"
          git push origin gh-pages

      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        continue-on-error: true
